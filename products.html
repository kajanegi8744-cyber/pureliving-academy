<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-ML22WP84" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<div class="top">THOUGHTFUL ESSENTIALS FOR EVERYDAY LIVING · DEMO STORE</div>
<header class="header">
<a class="logo" href="index.html">Pure<span>Living</span></a>
<nav class="nav"><a href="index.html">Home</a><a href="products.html">Shop</a><a href="resources.html">Resources</a><a href="contact.html">Contact</a><a href="cart.html">Bag (<span id="cartCount">0</span>)</a></nav>
</header>
<main class="wrap">
<div class="eyebrow">The PureLiving collection</div>
<div class="heading"><div><h1>Shop all essentials</h1><p class="muted">Thoughtful products for a more comfortable home.</p></div><span class="count" id="count">12 products</span></div>
<div class="controls">
<input id="search" type="search" placeholder="Search products..." aria-label="Search products">
<select id="category" aria-label="Filter by category"><option value="All">All categories</option><option>Water Purifiers</option><option>Air Purifiers</option><option>Kitchen Appliances</option><option>Home Essentials</option></select>
<select id="sort" aria-label="Sort products"><option value="featured">Featured products</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="az">Name: A to Z</option></select>
</div>
<div class="grid" id="products"></div>
</main>
<footer class="footer">© 2026 PureLiving Demo Store · All prices are for practice only. No real payments. · <a href="index.html">Home</a></footer>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
const products=[
{id:"PL-WP-001",name:"Aqua Pro Water Purifier",price:8999,category:"Water Purifiers",icon:"💧",badge:"Bestseller",desc:"A dependable everyday water purification solution."},
{id:"PL-WP-002",name:"Aqua Max Water Purifier",price:12499,category:"Water Purifiers",icon:"🚰",badge:"Popular",desc:"A premium option for your household."},
{id:"PL-WP-003",name:"Aqua Compact Purifier",price:6499,category:"Water Purifiers",icon:"🫗",badge:"Compact",desc:"A compact choice for smaller spaces."},
{id:"PL-AP-001",name:"Air Pure 300",price:7499,category:"Air Purifiers",icon:"🌿",badge:"Popular",desc:"Designed to complement your living space."},
{id:"PL-AP-002",name:"Air Pure 500",price:11999,category:"Air Purifiers",icon:"🍃",badge:"Premium",desc:"A larger air-care option for your home."},
{id:"PL-KA-001",name:"Smart Electric Kettle",price:1499,category:"Kitchen Appliances",icon:"☕",badge:"Everyday",desc:"Make your daily hot drinks with ease."},
{id:"PL-KA-002",name:"Mixer Pro",price:3499,category:"Kitchen Appliances",icon:"🥣",badge:"Bestseller",desc:"A versatile helper for everyday preparation."},
{id:"PL-KA-003",name:"Daily Use Blender",price:2999,category:"Kitchen Appliances",icon:"🥤",badge:"Popular",desc:"A simple blender for everyday recipes."},
{id:"PL-HE-001",name:"Home Care Kit",price:999,category:"Home Essentials",icon:"🧺",badge:"Value pick",desc:"Everyday helpers for a tidier home."},
{id:"PL-HE-002",name:"Smart Room Humidifier",price:2499,category:"Home Essentials",icon:"💨",badge:"New",desc:"A compact addition to your home environment."},
{id:"PL-HE-003",name:"Digital Kitchen Scale",price:799,category:"Home Essentials",icon:"⚖️",badge:"Everyday",desc:"A practical tool for precise measurements."},
{id:"PL-HE-004",name:"Premium Storage Set",price:1299,category:"Home Essentials",icon:"📦",badge:"Popular",desc:"Keep household items neatly organised."}
];
const $=s=>document.querySelector(s),money=n=>"₹"+n.toLocaleString("en-IN");
function fire(event,data={}){window.dataLayer=window.dataLayer||[];window.dataLayer.push({...data,event,demo_mode:true})}
function getCart(){try{return JSON.parse(localStorage.getItem("pl_demo_cart_v1")||"[]")}catch(e){return[]}}
function updateCount(){$("#cartCount").textContent=getCart().reduce((s,x)=>s+x.qty,0)}
function add(p){let c=getCart(),x=c.find(i=>i.id===p.id);if(x)x.qty++;else c.push({id:p.id,price:p.price,qty:1});localStorage.setItem("pl_demo_cart_v1",JSON.stringify(c));updateCount();fire("add_to_cart",{currency:"INR",value:p.price,items:[{item_id:p.id,item_name:p.name,item_category:p.category,price:p.price,quantity:1}]});$("#toast").textContent=p.name+" added to your bag";$("#toast").style.display="block";setTimeout(()=>$("#toast").style.display="none",2300)}
function render(){
let list=products.filter(p=>(p.name+" "+p.category+" "+p.desc).toLowerCase().includes($("#search").value.toLowerCase())&&($("#category").value==="All"||p.category===$("#category").value));
if($("#sort").value==="low")list.sort((a,b)=>a.price-b.price);
if($("#sort").value==="high")list.sort((a,b)=>b.price-a.price);
if($("#sort").value==="az")list.sort((a,b)=>a.name.localeCompare(b.name));
$("#count").textContent=list.length+" products";
$("#products").innerHTML=list.map(p=>`<article class="card"><div class="art"><span class="badge">${p.badge}</span><span>${p.icon}</span></div><div class="info"><div class="cat">${p.category}</div><h2>${p.name}</h2><div class="price">${money(p.price)} <span class="old">${money(Math.round(p.price*1.15))}</span></div><div class="desc">${p.desc}</div><div class="buttons"><a class="btn alt" href="product.html?id=${encodeURIComponent(p.id)}" data-view="${p.id}">View details</a><button class="btn" data-add="${p.id}">Add to bag</button><button class="btn alt" data-buy="${p.id}">Buy now</button></div></div></article>`).join("")||'<div class="empty">No products found. Try another search.</div>';
fire("view_item_list",{item_list_name:$("#category").value,items:list.map((p,i)=>({item_id:p.id,item_name:p.name,item_category:p.category,price:p.price,index:i}))});
}
$("#search").addEventListener("input",()=>{fire("search",{search_term:$("#search").value});render()});
$("#category").addEventListener("change",()=>{fire("select_content",{content_type:"product_category",item_id:$("#category").value});render()});
$("#sort").addEventListener("change",render);
$("#products").addEventListener("click",e=>{
const addBtn=e.target.closest("[data-add]"),buyBtn=e.target.closest("[data-buy]"),view=e.target.closest("[data-view]");
if(addBtn){const p=products.find(x=>x.id===addBtn.dataset.add);if(p)add(p)}
if(buyBtn){const p=products.find(x=>x.id===buyBtn.dataset.buy);if(p){add(p);location.href="index.html#checkout"}}
if(view){const p=products.find(x=>x.id===view.dataset.view);if(p)fire("select_item",{item_list_name:$("#category").value,items:[{item_id:p.id,item_name:p.name,price:p.price}]})}
});
updateCount();render();
})();
</script>
</body>
