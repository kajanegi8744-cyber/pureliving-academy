
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signup / Login Practice | PureLiving</title>

<!-- Google Tag Manager -->
<script>
(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;
f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-ML22WP84');

<style>
*{box-sizing:border-box}
body{margin:0;padding:35px 20px;background:#f5f8f5;color:#193b32;font-family:Arial,sans-serif}
main{max-width:1050px;margin:auto}
.eyebrow{font-size:12px;letter-spacing:2px;font-weight:bold;color:#18705d}
h1{font-size:clamp(32px,5vw,52px);margin:18px 0}
.forms{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:white;border:1px solid #dce8e0;border-radius:18px;padding:25px}
h2{font-size:22px;margin-top:15px}
label{display:block;font-size:14px;font-weight:bold;margin:18px 0 8px}
input{width:100%;padding:14px;border:1px solid #cedbd3;border-radius:10px;font-size:15px}
button{border:0;border-radius:30px;background:#197360;color:white;font-weight:bold;font-size:15px;padding:12px 24px;margin-top:20px;cursor:pointer}
button:disabled{opacity:.65;cursor:default}
.message{display:none;margin-top:18px;padding:14px;border-radius:10px;line-height:1.5}
.success{background:#e4f5e9;color:#17613a}
.error{background:#ffeded;color:#9a2525}
.notice{margin-top:18px;background:#fff4d9;border:1px solid #f0dfaa;border-radius:12px;padding:16px;color:#755626;line-height:1.5}
@media(max-width:700px){.forms{grid-template-columns:1fr}body{padding:22px 14px}}
</style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-ML22WP84"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<main>
  <div class="eyebrow">ACCOUNT DEMO</div>
  <h1>Signup / Login Practice</h1>

  <div class="forms">
    <section class="card">
      <h2>Create demo account</h2>
      <form id="signupForm">
        <label for="signupName">Name</label>
        <input id="signupName" type="text" autocomplete="off" required>

        <label for="signupEmail">Email</label>
        <input id="signupEmail" type="email" autocomplete="off" required>

        <label for="signupPassword">Password (demo only)</label>
        <input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required>

        <button type="submit" id="signupButton">Sign Up</button>
      </form>
      <div id="signupSuccess" class="message success" role="status"></div>
      <div id="signupError" class="message error" role="alert"></div>
    </section>

    <section class="card">
      <h2>Login demo</h2>
      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="off" required>

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="off" required>

        <button type="submit" id="loginButton">Login</button>
      </form>
      <div id="loginSuccess" class="message success" role="status"></div>
      <div id="loginError" class="message error" role="alert"></div>
    </section>
  </div>

  <div class="notice">
    Demo only: no real account is created, no authentication takes place,
    and no credentials are sent to a server. Never enter your real password.
  </div>
</main>

<script>
(function(){
  window.dataLayer = window.dataLayer || [];

  function setupForm(formId, buttonId, successId, errorId, eventName, message){
    var form = document.getElementById(formId);
    var button = document.getElementById(buttonId);
    var success = document.getElementById(successId);
    var error = document.getElementById(errorId);
    var submitted = false;

    form.addEventListener('submit', function(e){
      e.preventDefault();
      e.stopPropagation();

      if(submitted) return;

      success.style.display = 'none';
      error.style.display = 'none';

      if(!form.checkValidity()){
        form.reportValidity();
        error.textContent = 'Please complete all required fields correctly.';
        error.style.display = 'block';
        window.dataLayer.push({
          event: 'account_form_validation_error',
          form_type: eventName
        });
        return;
      }

      submitted = true;
      button.disabled = true;
      button.textContent = 'Successful';

      success.textContent = message;
      success.style.display = 'block';

      window.dataLayer.push({
        event: eventName,
        method: 'demo_form'
      });
    });
  }

  setupForm(
    'signupForm','signupButton','signupSuccess','signupError',
    'sign_up','Demo signup successful! No account or password was saved.'
  );

  setupForm(
    'loginForm','loginButton','loginSuccess','loginError',
    'login','Demo login successful! No real authentication was performed.'
  );
})();
</script>

</body>
</html>
