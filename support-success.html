<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f8f3;color:#24382c}
header{padding:18px 6%;background:#fff;border-bottom:1px solid #e1e8df;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.brand{font-size:24px;font-weight:800;color:#245c43;text-decoration:none}
nav{display:flex;gap:16px;flex-wrap:wrap}
nav a{color:#35463b;text-decoration:none;font-size:14px}
.hero{background:#e4eee2;padding:42px 20px;text-align:center}
.hero h1{font-size:clamp(30px,5vw,42px);margin:0 0 10px}
.hero p{color:#56675a;line-height:1.7}
main{max-width:850px;margin:35px auto;padding:0 20px}
.card{background:#fff;border:1px solid #e0e8df;border-radius:16px;padding:28px}
h2{margin-top:0}
label{display:block;font-size:14px;font-weight:bold;margin:17px 0 8px}
input,select,textarea{width:100%;padding:13px;border:1px solid #ccd7cc;border-radius:8px;font:inherit;background:white}
input:focus,select:focus,textarea:focus{outline:2px solid #a8cfb1;border-color:#397c52}
textarea{min-height:120px;resize:vertical}
button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:30px;background:#286443;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.65;cursor:not-allowed}
.note{font-size:12px;color:#6b786e;line-height:1.7;margin-top:18px}
footer{text-align:center;padding:25px;color:#6a766c;font-size:13px}
@media(max-width:600px){header{padding:16px 5%}.card{padding:20px}}

</nav>

<section class="hero">
<h1>Customer Support</h1>
<p>Tell us about your issue using this demo support form.</p>
</section>

<main>
<section class="card">
<h2>Submit a support request</h2>

<form id="supportForm">
<label for="topic">Support topic *</label>
<select id="topic" required>
<option value="">Select a topic</option>
<option value="product">Product information</option>
<option value="order">Order or checkout</option>
<option value="account">Account assistance</option>
<option value="website">Website issue</option>
<option value="other">Other enquiry</option>
</select>

<label for="priority">Priority *</label>
<select id="priority" required>
<option value="">Select priority</option>
<option value="normal">Normal</option>
<option value="high">High</option>
</select>

<label for="name">Your name *</label>
<input id="name" type="text" required autocomplete="off">

<label for="email">Email address *</label>
<input id="email" type="email" required autocomplete="off">

<label for="issue">Describe your issue *</label>
<textarea id="issue" required minlength="10" placeholder="Write your issue here..."></textarea>

<button type="submit" id="submitButton">Submit Support Request</button>
</form>

<p class="note">Demo only: your request is not sent to a real support team. Use dummy details only.</p>
</section>
</main>

<footer>© 2026 PureLiving Academy · Demo website for analytics practice</footer>

<script>
(function(){
window.dataLayer=window.dataLayer||[];

var form=document.getElementById('supportForm');
var button=document.getElementById('submitButton');
var started=false;
var submitted=false;

form.addEventListener('focusin',function(){
  if(!started){
    started=true;
    window.dataLayer.push({
      event:'support_form_start',
      form_id:'supportForm',
      form_type:'support_request'
    });
  }
});

form.addEventListener('submit',function(e){
  e.preventDefault();

  if(submitted)return;

  if(!form.checkValidity()){
    form.reportValidity();
    window.dataLayer.push({
      event:'support_form_validation_error',
      form_id:'supportForm'
    });
    return;
  }

  submitted=true;
  button.disabled=true;
  button.textContent='Opening confirmation...';

  window.dataLayer.push({
    event:'support_request',
    form_id:'supportForm',
    support_topic:document.getElementById('topic').value,
    priority:document.getElementById('priority').value
  });

  window.location.href='/pureliving-academy/support-success.html';
});
})();
</script>

</body>
